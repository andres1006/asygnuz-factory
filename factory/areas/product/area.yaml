description: PRD, RF/RNF, alcance, priorización, KPIs y validación funcional.
roles:
  - product
gates:
  - 1
owns:
  - docs/00-prd.md
  - docs/01-requisitos-funcionales.md
  - docs/02-requisitos-no-funcionales.md
