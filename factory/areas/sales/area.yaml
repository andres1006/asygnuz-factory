id: sales
name: Sales
status: active
description: Pipeline comercial, outbound, calificación, propuestas y handoff de marketing a revenue.
roles:
  - marketing
gates: []
owns:
  - sales/pipeline.md
  - sales/outreach-sequences.md
  - sales/proposals/
inputs:
  - docs/marketing/00-marketing-brief.md
  - campaigns/
  - reports/weekly-marketing-report.md
outputs:
  - sales/pipeline.md
  - sales/qualified-leads.md
  - sales/proposals/*
handoffs:
  - to: marketing
    artifact: sales/objection-log.md
    purpose: Retroalimentar copy, oferta y campañas.
  - to: product
    artifact: sales/customer-requirements.md
    purpose: Alimentar roadmap y requisitos desde oportunidades reales.
  - to: finance
    artifact: sales/closed-won.md
    purpose: Actualizar forecast, revenue y comisiones.
policies:
  autonomous:
    - lead_research
    - draft_outreach
    - proposal_drafting
  human_required:
    - sending_outreach
    - pricing_commitment
    - contract_commitment
    - lead_or_customer_contact
metrics:
  - qualified_leads
  - close_rate
  - pipeline_value
  - sales_cycle_days
references:
  profiles:
    - factory/agents/profiles/marketing.md
  prompts:
    - factory/agents/prompts/marketing.md
  playbooks:
    - factory/playbooks/marketing-playbook.md
